name: Continuous Delivery Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-integration:
    name: Verificacion de calidad
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  build-and-package:
    name: Construccion y artefacto
    needs: continuous-integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Construir aplicacion
        run: |
          npm ci
          npm run build

      - name: Construir imagen Docker
        run: docker build -t laboratorio-cd:${{ github.sha }} .

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  deploy-to-staging:
    name: Despliegue a staging
    needs: build-and-package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Vercel CLI
        run: npm install --global vercel

      - name: Descargar configuracion
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Reinstalar dependencias para el despliegue
        run: npm ci --include=dev

      - name: Construir para Vercel
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Publicar en staging
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"